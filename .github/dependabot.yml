# Dependabot version updates. See docs/adr/0008-dependency-vulnerability-checks.md.
# Security updates are switched on in the repository settings, not here.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # One pull request for every minor and patch update, so `next` and
    # `eslint-config-next` move together.
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major updates are decided by a person, not by a bot (ADR 0008).
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # ADR-gated packages (ADR 0008). They move only with an ADR, so a
      # version-update pull request for one could never merge as-is. One of
      # them inside the grouped minor-and-patch pull request would also hold
      # every routine update hostage, and they move in coupled sets. The ignore
      # stops at version updates on purpose: an ignore rule with update types
      # does not apply to security updates. Those are not in the group
      # (`applies-to: version-updates`), so they arrive as a pull request of
      # their own. That pull request is an alarm, not something to merge. The
      # response is an ADR and a separate upgrade pull request, after which
      # Dependabot's is closed.
      - dependency-name: prisma
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@prisma/client"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@prisma/adapter-pg"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: better-auth
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: auth
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    # Commits read "chore(deps): ..." for production and development
    # dependencies alike. The scope is part of the prefix, not `include: scope`,
    # which would give "chore(deps-dev)" for development dependencies. Dependabot
    # adds the colon itself when the prefix ends with a closing parenthesis.
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # No major-version ignore: actions are referenced by major tag (`@v7`), and
    # only a major update moves such a reference (ADR 0008).
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    # Same prefix as npm: "chore(deps): ...".
    commit-message:
      prefix: "chore(deps)"
