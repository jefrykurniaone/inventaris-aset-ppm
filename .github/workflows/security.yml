name: Security

# Vulnerability checks live in their own workflow, not in `ci.yml`'s `verify`
# job, so that a newly published advisory fails only these checks. Inside
# `verify` the audit used to skip the coverage upload and, with it, SonarQube
# and the end-to-end smoke test. The policy is recorded in ADR 0008.
#
# There is no `schedule`: between pull requests, Dependabot alerts are what
# surface a new advisory (ADR 0008).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Neither job writes anything. `comment-summary-in-pr` stays off below, which
# is what lets this remain the only permission.
permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The whole dependency tree, development tooling included, at `high`. A
      # high advisory with no patch in any package fails every pull request
      # until it is resolved, and the emergency path is the administrator
      # exemption. Moderate and low advisories appear only as Dependabot
      # alerts. The reasoning is in ADR 0008's 2026-11-14 amendment (issue
      # #209), which supersedes the earlier `--omit=dev` scope.
      #
      # There is no install step. `npm audit` reads `package-lock.json`
      # directly, so no dependency's `preinstall`/`postinstall` runs in this job
      # at all (githubactions:S6505), which is stronger than `verify`'s
      # `npm ci --ignore-scripts`. Verified from a directory holding only
      # `package.json` and `package-lock.json`: exit 0 on `main`, and the same
      # directory reports the same six moderate `minimatch` findings as a full
      # install, so the audit does read the lockfile. See the pull request for
      # #209. If a lockfile-only audit ever stops working on the runner, fall
      # back to `npm ci --ignore-scripts` and write the reason here.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    # The action diffs the dependencies between the pull request's base and
    # head. A push to `main` has no base to compare against, and the audit job
    # already covers the resulting tree.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # GitHub's own action, so a major tag rather than a commit SHA, like the
      # other `actions/*` references in this repository. It judges only the
      # dependencies a pull request adds or changes, so an advisory already in the
      # tree does not trip it.
      #
      # `high` across both scopes: the action's default scope is `runtime`
      # alone, which would let a vulnerable dev tool in unreviewed. No licence
      # option is set, so no licence policy applies, and
      # `comment-summary-in-pr` is `never`, so the job needs no
      # `pull-requests: write`. The result is in the job summary instead.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          comment-summary-in-pr: never
