name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Generation and type-checking need a syntactically valid URL, not a reachable database.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` keeps every dependency's `preinstall`/`postinstall`
      # out of the runner (githubactions:S6505). Two packages here declare one,
      # and neither turns out to be load-bearing:
      #
      #   - `prisma@7.9.1` (`preinstall`) and its `@prisma/engines@7.9.1`
      #     (`postinstall`) place the engine binaries. Skipping them only defers
      #     that: `@prisma/fetch-engine` is a plain runtime dependency, so the
      #     CLI fetches the engine on first use instead — inside the generate
      #     step below rather than inside this one.
      #   - `unrs-resolver@1.12.2` (`postinstall`) is `napi-postinstall`, a
      #     fallback for when the platform binding did not resolve. On this
      #     runner it does resolve: `@unrs/resolver-binding-linux-x64-gnu` is an
      #     optional dependency in `package-lock.json` and installs as an
      #     ordinary package, with no lifecycle script of its own.
      #
      # This repository's own `prepare` script (husky) is skipped too, which is
      # wanted: git hooks are for a developer's checkout, not for a runner.
      #
      # Verified empirically from a checkout with no `node_modules`, not
      # inferred: see the pull request for #50.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs before the Prisma generate and the typecheck because it is the
      # cheapest step in the job and needs nothing but the checkout: a file
      # whose bytes are already corrupt should not wait on a build to say so.
      #
      # This is the authoritative half of the guard. The `lint-staged` entry
      # catches damage at commit time on a developer's machine, but a hook can
      # be skipped with `--no-verify` and only runs where husky is installed;
      # this step runs on every pull request regardless. Same division of
      # labour as SonarQube Cloud versus the editor extension, and for the same
      # reason — see `CLAUDE.md`.
      - name: Check text encoding
        run: npm run check:encoding

      # The generated Prisma client is not committed, so typecheck and build
      # have nothing to import until it exists. Generation reads the schema
      # only: it opens no connection, which is why the placeholder URLs above
      # are enough. `prisma migrate dev` does not generate as a side effect in
      # Prisma 7, so this step is not redundant.
      #
      # `--no` runs the `prisma` binary `npm ci` just installed, or fails.
      # Without it `npx` silently fetches a package when the local one is
      # missing and runs its lifecycle scripts (githubactions:S6505), and the
      # version it fetches is whatever `latest` resolves to rather than a pinned
      # one (githubactions:S8543). With it, the version that runs is the exact
      # one `package-lock.json` resolved, so no separate pin is needed. Same
      # reasoning as `auth:generate` in `package.json`; see `CLAUDE.md`.
      - name: Generate Prisma client
        run: npx --no prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      # Handed to the `sonar` job below rather than analysed here, so that
      # SONAR_TOKEN never enters the environment of a job that runs `npm ci`
      # and therefore third-party install scripts.
      - name: Upload coverage for analysis
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: verify
    # Runs on every pull request and needs no secret and no external service:
    # photos are stored in PostgreSQL (ADR 0009), so the smoke path
    # (`e2e/photo-upload.spec.ts`, `e2e/label-printing.spec.ts`) — a real
    # sign-in, a real upload, a real read back — runs against the `postgres`
    # service container below.
    env:
      # The seeded administrator and the account Playwright signs in as are
      # the same one, so the pair is declared here once and read by both the
      # seed step (`SEED_ADMIN_*`) and the Playwright step. Literals are safe
      # because the database they unlock is a throwaway service container that
      # is destroyed when the job ends, is not reachable from outside the
      # runner, and holds nothing but this run's seed data — the same
      # reasoning as `BETTER_AUTH_SECRET` below. They are not the credentials
      # of any deployment.
      E2E_EMAIL: e2e-admin@example.invalid
      E2E_PASSWORD: e2e-throwaway-password-not-used-in-any-deployment
      # A local, ephemeral database for this job only — not a secret. Both
      # point at the `postgres` service container below, same as `verify`'s
      # placeholders point nowhere; the difference here is that migrations
      # and a real sign-in run against this one.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # Signs this run's session cookies only. Not the production secret and
      # not sensitive: the database it is paired with is destroyed when the
      # job ends.
      BETTER_AUTH_SECRET: ci-e2e-session-signing-secret-not-used-in-any-deployment
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Same `--ignore-scripts` reasoning as `verify`'s install step.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx --no playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx --no prisma generate

      - name: Run migrations against the CI database
        run: npx --no prisma migrate deploy

      # Seeds the exact account `E2E_EMAIL`/`E2E_PASSWORD` sign in as
      # (`src/lib/seed-admin.ts`), plus the full demonstration dataset
      # (issue #16) — `DATABASE_URL` above resolves to `localhost`, so
      # `isLocalDatabaseUrl` allows this without `SEED_ALLOW_REMOTE` — the
      # safeguard that exists is "never seed a deployment by accident", and
      # this database is neither.
      #
      # `SEED_SKIP_PHOTOS=true` (issue #16 hand-back 1): the smoke path
      # uploads its own photo, so the demonstration dataset's photos are left
      # out. It is the explicit instruction to skip
      # (`prisma/seed-data/photo-writer.ts`), not something inferred from the
      # environment.
      - name: Seed the first administrator
        run: npm run db:seed
        env:
          SEED_ADMIN_EMAIL: ${{ env.E2E_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ env.E2E_PASSWORD }}
          SEED_SKIP_PHOTOS: "true"

      # `npm run db:seed` above seeds only the administrator; the asset
      # create form's `categoryId` and `roomId` pickers need at least one
      # active `Category` and one active `Room` (with its `Building`) to
      # offer, or the specs' `createAsset` helper hangs selecting an option
      # that does not exist (issue #70). The full demonstration dataset is
      # issue #16's — this step seeds only what the smoke path needs.
      - name: Seed master data for the smoke path
        run: npm run db:seed:e2e-master-data

      # `E2E_EMAIL`/`E2E_PASSWORD` come from the job's `env` above. Without
      # them both specs skip themselves, which `--pass-with-no-tests` would
      # report as a pass — so they must stay declared there.
      - name: Run the Playwright smoke path
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: verify
    # Derived from the secret without exposing it: an expression in `env` is
    # allowed to read `secrets`, a step-level `if` is not. Lets the workflow stay
    # green before the secret exists, instead of failing on a missing token.
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A shallow clone degrades new-code detection, which is what the
          # pull-request gate is measured on.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      # Pinned to a commit rather than a tag: this is the one third-party action
      # in the workflow, and a tag can move. `v8.2.1`.
      - name: Analyse
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Report that analysis was skipped
        if: env.HAS_SONAR_TOKEN != 'true'
        run: |
          echo "::warning title=SonarQube Cloud not analysed::SONAR_TOKEN is not set, so this commit was not analysed. See docs/sonarcloud-analysis.md."
