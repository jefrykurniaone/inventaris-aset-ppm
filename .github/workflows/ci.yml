name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Generation and type-checking need a syntactically valid URL, not a reachable database.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Storage is Supabase in every environment (ADR 0005), but CI runs no e2e and
  # holds no Supabase secrets, so these only need to be present and well-formed
  # for type-checking and the build. Nothing in CI reaches the network.
  SUPABASE_URL: https://ci-placeholder.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-not-used-at-build-time
  SUPABASE_STORAGE_BUCKET: asset-photos-dev

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma is not a dependency yet; the client-generation step is restored
      # by the spec that adds the schema (issue #3).

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build
