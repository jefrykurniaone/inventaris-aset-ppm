name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Generation and type-checking need a syntactically valid URL, not a reachable database.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  STORAGE_DRIVER: local
  LOCAL_STORAGE_DIR: .storage

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build
