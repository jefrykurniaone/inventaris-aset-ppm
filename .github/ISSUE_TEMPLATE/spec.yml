name: Specification
description: A unit of work with acceptance criteria, sized to one pull request.
title: "[spec] "
labels: ["type:spec"]
body:
  - type: markdown
    attributes:
      value: |
        One specification is one pull request. Write it so that an executor with no prior context
        can implement it: name the files, name the constraints, and make the acceptance criteria
        checkable.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when this is done. One or two sentences.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >
        Why this is needed and how it fits. Link the relevant section of docs/prd.md and any ADR
        that constrains the approach.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. Avoid anything a reviewer cannot verify.
      value: |
        - [ ]
        - [ ]
        - [ ] Unit tests cover the business logic introduced here
        - [ ] `npm run lint`, `npm run typecheck`, and `npm run test` pass
        - [ ] No hardcoded user-facing strings; `id` and `en` messages both complete
        - [ ] Zero SonarQube issues on the touched files
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files expected to change
      description: Best current guess. Helps avoid two concurrent tickets colliding.
      placeholder: |
        src/lib/...
        src/app/...
        prisma/schema.prisma
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: >
        What this ticket must not do. Scope boundaries, architectural seams to respect, things
        deliberately left to a later ticket.
    validations:
      required: false

  - type: dropdown
    id: wave
    attributes:
      label: Wave
      options:
        - "0 — scaffold and spike"
        - "1 — data layer, auth, master data"
        - "2 — assets and photos"
        - "3 — QR and labels"
        - "4 — reporting, loans, seed"
    validations:
      required: true

  - type: dropdown
    id: executor
    attributes:
      label: Executor model
      description: >
        Opus for work where a wrong decision propagates outward — schema, auth boundaries, token
        generation, visibility enforcement, aggregation. Sonnet for work with a fully specified
        target.
      options:
        - opus
        - sonnet
    validations:
      required: true

  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must close first.
      placeholder: "#1, #3"
    validations:
      required: false
