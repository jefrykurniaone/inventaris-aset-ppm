name: Spec
description: The output of a grilling session. One coherent surface, decided end to end.
title: "spec: "
labels: ["ready-for-agent"]
body:
  - type: markdown
    attributes:
      value: |
        A spec is decided work, not a wish. It states the problem in the words of the people who
        have it, settles every open decision, and says what is out of scope so that nothing is
        picked up opportunistically. It is not broken into tickets here — a `map:` issue does that,
        and the tickets hang off the map as sub-issues.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: >
        What is wrong today, concretely. Name the failures rather than the missing features, and
        say who suffers each one.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: >
        What is being built, and the one or two mechanisms that carry the weight. Settle them here
        so no ticket has to invent them.
    validations:
      required: true

  - type: textarea
    id: stories
    attributes:
      label: User Stories
      description: >
        Numbered, one line each, grouped by persona. "As a <persona>, I want <outcome>, so that
        <reason>." Every story must be checkable against the finished surface.
      value: |
        1. As a , I want , so that .
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: Implementation Decisions
      description: >
        Grouped by area, with `###` subheadings. Each is a decision already taken, with its
        reasoning, so it is not relitigated in a ticket. Include the constraints carried through
        from `CLAUDE.md` and any binding ADR.
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing Decisions
      description: >
        What is unit tested, what is covered end to end, and what must be verified physically or
        against real infrastructure rather than claimed from a screen.
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: >
        Everything deliberately excluded, including roadmap items, so a reader can tell a decision
        from an oversight.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Further Notes
      description: >
        Risks with their mitigations, open items with an owner, and anything a reader would
        otherwise reasonably ask about.
    validations:
      required: false
