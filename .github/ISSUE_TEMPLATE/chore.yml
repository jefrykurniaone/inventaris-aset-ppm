name: Chore
description: Tooling, dependencies, CI, configuration, or documentation. No product behaviour change.
title: "[chore] "
labels: ["type:chore"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs doing.
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: >
        Why now. If this adds a dependency, record the licence, maintenance status, and CVE check
        here — the coding standard requires it before merge.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ] CI green
        - [ ] No product behaviour changed
    validations:
      required: true

  - type: dropdown
    id: executor
    attributes:
      label: Executor model
      options:
        - opus
        - sonnet
    validations:
      required: false
