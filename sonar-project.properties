# SonarQube Cloud analysis. Read `docs/sonarcloud-analysis.md` before changing anything here —
# two of these lines look like noise and are not.

sonar.organization=jefry-kurniawan
sonar.projectKey=jefrykurniaone_inventaris-aset-ppm
sonar.sourceEncoding=UTF-8

# `.` rather than a list of directories, deliberately. A list silently drops whatever it forgets to
# name — the root configuration files, and `.github/workflows`, whose `githubactions:*` rules are the
# clearest evidence that server-side analysis earns its keep, since SonarLint in the editor does not
# analyse workflow YAML at all.
sonar.sources=.

# `src/generated` is the Prisma client: over twenty thousand generated lines that would swamp both the
# issue list and the duplication metric. `.claude` holds sub-agent worktrees — whole copies of this
# repository, which would otherwise be analysed as if they were part of it. The rest is build output.
#
# The `*.test.*` entries are load-bearing, not tidiness: a file cannot be both source and test in one
# analysis, and the scanner fails outright with "Source and test paths overlap" if one is. Tests are
# co-located beside their source here, so the two sets are made disjoint by pattern — sources exclude
# the test files, and `sonar.test.inclusions` below admits nothing else.
sonar.exclusions=src/generated/**,.next/**,coverage/**,test-results/**,playwright-report/**,node_modules/**,.claude/**,**/*.test.ts,**/*.test.tsx

# Same root as `sonar.sources`, disjoint by filter. Scoped to `src/` rather than `**/` so that a test
# file inside a sub-agent worktree under `.claude/` cannot be picked up as one of this project's.
sonar.tests=.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mirrors `coverage.include` and `coverage.exclude` in `vitest.config.mts`, which instruments
# `src/lib/**` only. Sonar cannot tell "not instrumented" from "not covered", so without this every
# new page and component counts as uncovered new code and the gate fails on work that is behaving
# exactly as designed. Keep this in step with `vitest.config.mts`; do not delete it to "fix" a
# coverage number.
sonar.coverage.exclusions=src/app/**,src/components/**,src/i18n/**,src/lib/db.ts,src/lib/auth.ts,src/lib/auth-client.ts,scripts/**,prisma/**,e2e/**,.github/**,*.ts,*.mts,*.mjs

# Fail the pipeline when the quality gate fails, rather than posting a status nobody is blocked by.
sonar.qualitygate.wait=true
